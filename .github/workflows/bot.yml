name: Fenerbahçe Bot

on:
  schedule:
    # 1. Sabah Uyanışı: Türkiye saatiyle tam 10:14'te (UTC 07:14) "Bugün Maç Var" bildirimi için 1 kez çalışır.
    - cron: '14 7 * * *'
    
    # 2. Aktif Maç Nöbeti: Türkiye saatiyle 12:14'ten gece 02:59'a kadar (UTC 09:00 - 23:59) her 15 dakikada bir çalışır.
    - cron: '14,29,44,59 9-23 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python bot.py
