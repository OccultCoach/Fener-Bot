name: Fenerbahçe Bot

on:
  schedule:
    # Türkiye saatiyle 10:14'ten gece 02:59'a kadar her 15 dakikada bir çalışır.
    # (UTC 07:00 - 23:59). Sabah bildirimini tam 10:14'te atar.
    - cron: '14,29,44,59 7-23 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python bot.py
