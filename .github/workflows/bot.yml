name: Fenerbahçe Bot

on:
  schedule:
    # 1. Sabah 09:30 (06:30 UTC) - Günlük genel kontrol ve "Bugün Maç Var" bildirimi
    - cron: '30 6 * * *'

    # 2. Akşam 18:30 - 00:45 arası her 15 dakikada bir (15:30 - 21:45 UTC)
    # Kadro (1 saat kala), Başlıyor (15 dk kala) ve Maç Sonu bildirimlerini yakalar
    - cron: '*/15 15-21 * * *'

  # Manuel çalıştırma butonu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: State değiştiyse GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot_state.json

          if git diff --cached --quiet; then
            echo "State değişmedi."
          else
            git commit -m "Update Fenerbahce bot state"
            git push
          fi
