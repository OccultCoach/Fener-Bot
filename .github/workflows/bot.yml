name: Fenerbahçe Bot

on:
  schedule:
    # Her gün Türkiye saatiyle 09:30
    # GitHub Actions cron UTC kullandığı için 06:30 UTC
    - cron: '30 6 * * *'

  # GitHub Actions panelinden manuel çalıştırma
  workflow_dispatch:

# bot_state.json dosyasını repository'ye yazabilmek için
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: State değiştiyse GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot_state.json

          if git diff --cached --quiet; then
            echo "State değişmedi."
          else
            git commit -m "Update Fenerbahce bot state"
            git push
          fi
