name: Fenerbahçe Bot

on:
  schedule:
    # 1. Sabah 09:29 (06:29 UTC) - Günlük kontrol
    - cron: '29 6 * * *'

    # 2. Türkiye saatiyle 13:00 - 02:59 arası (UTC 10:00 - 23:59) her 15 dakikada bir
    # Gece uzayan ve penaltılara giden maçları da eksiksiz kapsar
    - cron: '14,29,44,59 10-23 * * *'

  # Manuel çalıştırma butonu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: State değiştiyse GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot_state.json

          if git diff --cached --quiet; then
            echo "State değişmedi."
          else
            git commit -m "Update Fenerbahce bot state"
            git push
          fi
